<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 덮어쓰기 예제</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (더 밑에 위치하여 Bootstrap보다 우선 적용됨) -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* (2) 우선순위 높이기 (비추천이지만 예제 포함) */
        .btn-custom {
            background-color: #ff5733 !important; /* 강제 적용 */
            color: white !important;
        }

        /* (3) specificity 점수 높이기 */
        div.card-body .custom-text {
            font-size: 18px;
            color: darkblue;
        }

        /* (4) 부트스트랩 클래스 확장 */
        .btn-primary.custom-btn {
            background-color: #4caf50; /* 기존 파란색을 초록색으로 변경 */
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center my-4">CSS 덮어쓰기 적용 예제</h2>

        <!-- (4) 부트스트랩 클래스를 유지하면서 추가적인 커스텀 스타일 적용 -->
        <button class="btn btn-primary custom-btn">기본 버튼 (초록색 변경)</button>

        <!-- (2) !important 사용 예제 (비추천) -->
        <button class="btn btn-custom">강제 스타일 버튼</button>

        <!-- (3) specificity 점수 높이기 -->
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Card title</h5>
                <p class="custom-text">이 텍스트는 darkblue 색상과 18px 크기로 변경됨</p>
            </div>
        </div>
    </div>
</body>
</html>
