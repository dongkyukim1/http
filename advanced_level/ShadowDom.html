<!DOCTYPE html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowDom</title>
    <link href="css/class2.css" rel="stylesheet" />
  </head>
  <!-- <body>
    ShadowDom 개념 : 태그안에 숨어있는 span 태그등등  -->
    <input type="file" class="input-file" style="color: rgb(114, 159, 199);" />
    <!-- 이렇게하면 span 쪽만 색이 바뀜 -->
    <!-- -webkit-은 크롬,사파리,Edge에서만 적용되는 스타일 vs -ms-,-moz- -->
     <input placeholder="이름을 입력하세요" />  

     <!-- user agent stylesheet : 브라우저가 기본적으로 가지고 있는 스타일 -->
      <!-- apperance : none;  브라우저가 가지고 있는 스타일을 없애줌 -->
      <!-- input 태그의 스타일을 변경할 수 있음 -->
     <input type="range" min="0" max="100" value="50" />
    
     <progress value="1"></progress>
  </body>
</html>
