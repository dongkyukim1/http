<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/animate3d.css">
</head>
<body>
    <!-- 3D 플립 컨테이너 -->
    <div class="flip-outer">
      <div class="flip-inner">
        <!-- 앞면: 애플 로고 이미지 -->
        <img src="image/apple.png" alt="Apple Logo" class="front"/>
  
        <!-- 뒷면: 텍스트 등 원하는 내용 -->
        <div class="back">
          <h4>This is Apple</h4>
        </div>
      </div>
    </div>
  </body>
</html>
