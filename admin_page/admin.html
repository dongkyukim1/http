<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Page Example</title>
    <!-- 외부 CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <!-- 폰트어썸 (아이콘) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <!-- 메인 컨테이너 -->
    <div class="d-flex">
      <!-- 사이드바 -->
      <nav id="sidebar" class="text-white">
        <div class="py-3 text-center">
          <i class="fas fa-home fa-2x"></i>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item mb-2">
            <a href="#" class="nav-link text-white">
              <i class="fas fa-tachometer-alt"></i>
              <span class="menu-text">Dashboard</span>
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link text-white">
              <i class="fas fa-tasks"></i>
              <span class="menu-text">Tasks</span>
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link text-white">
              <i class="fas fa-comments"></i>
              <span class="menu-text">Requests</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 우측 컨텐츠 -->
      <div class="flex-grow-1">
        <!-- 상단 Navbar -->
        <nav class="navbar navbar-expand navbar-light bg-light px-3">
          <!-- 왼쪽 검색바 -->
          <form class="d-flex search-form">
            <input
              class="form-control search-input"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-primary ms-2" type="submit">
              <i class="fas fa-search"></i>
            </button>
          </form>

          <!-- 우측 아이콘/유저 영역 -->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item position-relative me-3">
              <a href="#" class="nav-link">
                <i class="fas fa-bell"></i>
                <span class="badge bg-danger rounded-pill notification-badge"
                  >5</span
                >
              </a>
            </li>
            <li class="nav-item position-relative me-3">
              <a href="#" class="nav-link">
                <i class="fas fa-envelope"></i>
                <span class="badge bg-danger rounded-pill notification-badge"
                  >9</span
                >
              </a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Minny Park</a>
            </li>
          </ul>
        </nav>

        <!-- 본문 컨테이너 (왼쪽 테두리 포함) -->
        <div class="container-fluid mt-4">
          <!-- 카드 4개 -->
          <div class="row g-3">
            <!-- Earnings (Monthly) -->
            <div class="col-md-3">
              <div class="custom-card">
                <div
                  class="card-color-bar"
                  style="background-color: #4e73df"
                ></div>
                <div class="card-body-content">
                  <div class="card-title">Earnings (Monthly)</div>
                  <div class="card-value">$400,000</div>
                </div>
                <!-- 오른쪽 아이콘 -->
                <div class="card-icon">
                  <i class="fas fa-calendar"></i>
                </div>
              </div>
            </div>
            <!-- Earnings (Annual) -->
            <div class="col-md-3">
              <div class="custom-card">
                <div
                  class="card-color-bar"
                  style="background-color: #1cc88a"
                ></div>
                <div class="card-body-content">
                  <div class="card-title">Earnings (Annual)</div>
                  <div class="card-value">$800,000</div>
                </div>
                <!-- 오른쪽 아이콘 -->
                <div class="card-icon">
                  <i class="fas fa-dollar-sign"></i>
                </div>
              </div>
            </div>
            <!-- Tasks -->
            <div class="col-md-3">
              <div class="custom-card">
                <div
                  class="card-color-bar"
                  style="background-color: #36b9cc"
                ></div>
                <div class="card-body-content">
                  <div class="card-title">Tasks</div>
                  <div class="card-value">13</div>
                </div>
                <!-- 오른쪽 아이콘 -->
                <div class="card-icon">
                  <i class="fas fa-clipboard-list"></i>
                </div>
              </div>
            </div>
            <!-- Requests -->
            <div class="col-md-3">
              <div class="custom-card">
                <div
                  class="card-color-bar"
                  style="background-color: #f6c23e"
                ></div>
                <div class="card-body-content">
                  <div class="card-title">Requests</div>
                  <div class="card-value">26</div>
                </div>
                <!-- 오른쪽 아이콘 -->
                <div class="card-icon">
                  <i class="fas fa-comments"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- 그래프 (Chart.js) -->
          <div class="row mt-4">
            <div class="col-lg-8 mb-3">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Earnings Overview</h5>
                  <canvas id="myChart"></canvas>
                </div>
              </div>
            </div>
            <!-- 오른쪽 예시 Tasks 목록 -->
            <div class="col-lg-4 mb-3">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Tasks</h5>
                  <ul class="list-group">
                    <li
                      class="list-group-item d-flex justify-content-between align-items-center"
                    >
                      Borrowed Items
                      <span class="badge bg-primary rounded-pill">14</span>
                    </li>
                    <li
                      class="list-group-item d-flex justify-content-between align-items-center"
                    >
                      Trello requests
                      <span class="badge bg-primary rounded-pill">2</span>
                    </li>
                    <li
                      class="list-group-item d-flex justify-content-between align-items-center"
                    >
                      Marked Comments
                      <span class="badge bg-primary rounded-pill">1</span>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          <!-- //row -->
        </div>
        <!-- //container-fluid -->
      </div>
      <!-- //flex-grow-1 -->
    </div>
    <!-- //d-flex -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 커스텀 JS -->
    <script src="main.js"></script>
  </body>
</html>
